name: Publish image

# Builds the production image and pushes it to GHCR, tagged by commit SHA
# (sha-<short>) plus `latest` on main. Tenant manifests pin the sha- tag by
# digest, matching the other personal-platform workloads.

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - scripts/**
      - static/**
      - package.json
      - package-lock.json
      - svelte.config.js
      - vite.config.*
      - tsconfig.json
      - Dockerfile
      - .github/workflows/publish-image.yaml
  workflow_dispatch:

env:
  # Pinned to the app name (repo is clunc/action-log); keeps parity with the
  # other tenants' image names (gym-logger, mobility-logger, ...).
  IMAGE: ghcr.io/clunc/action-logger

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # runner stage = production image (see Dockerfile). amd64 only: the
          # target node is an Intel N100, and better-sqlite3 is a native module
          # so a single matching arch avoids cross-compilation.
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report pushed digest
        run: |
          echo "Pushed:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
